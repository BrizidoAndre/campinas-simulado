<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Word Split Shuffle</title>
    <style>
        .container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding-top: 3rem;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        input {
            padding: 1rem;
        }

        input:focus {
            outline-color: dodgerblue;
        }

        .flex {
            display: flex;
            gap: .5rem;
        }

        .letter {
            width: 80px;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 3px 0 rgba(0, 0, 0, .2);
            font-size: 1.5rem;
            font-weight: bolder;
        }

        .btn {
            color: white;
            background: dodgerblue;
            padding: 1rem;
            border-radius: .5rem;
            font-weight: bolder;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <input type="text" id="split">
    <div class="flex">
    </div>
    <button id="shuffle" class="btn">Suffle Letter</button>
</div>
<script>
    const flexContainer = document.querySelector('.flex');
    const split = document.getElementById('split');
    let word = '';
    split.addEventListener('input', (ev) => {
        word = split.value;
        let letters = split.value.split('');
        flexContainer.innerHTML = '';
        letters.forEach(letter => {
            flexContainer.innerHTML += `<div class="letter">${letter}</div>`
        })
    })
    shuffle.addEventListener('click', () => {
        let letters = word.split('');
        letters.sort((a, b) => Math.random() - .5);
        flexContainer.innerHTML = '';
        letters.forEach(letter => {
            flexContainer.innerHTML += `<div class="letter">${letter}</div>`
        })
    })
</script>
</body>
</html>
