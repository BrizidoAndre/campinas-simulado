<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dynamic notebook</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Corbel, sans-serif;
        }

        .container {
            width: min(80%, 500px);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 auto;
            padding-top: 2rem;
            gap: 1rem;
        }

        textarea {
            width: 100%;
            padding: 1rem;
            border-radius: .5rem;
        }

        textarea:focus {
            outline-color: cornflowerblue;
        }
    </style>
</head>
<body>
<div class="container">
    <textarea style="height: 80px" placeholder="Start writing..."></textarea>
</div>
<script>
    const container = document.querySelector('.container');

    function addEvent() {
        const textareas = document.querySelectorAll('textarea');
        textareas.forEach((area, i) => {
            area.addEventListener('keydown', (ev) => {
                let {key} = ev;
                if (key === 'Enter' && !ev.shiftKey) {
                    ev.preventDefault();
                    console.log(key);
                    let textArea = document.createElement('textarea');
                    textArea.placeholder = 'Start writing...'
                    textArea.style.height = '80px';
                    container.appendChild(textArea);
                    textArea.focus();
                    addEvent()
                } else if (key === 'Enter' && ev.shiftKey) {
                    let currentHeight = textareas[i].style.height;
                    let addHeight = parseInt(currentHeight.replace('px', ''));
                    textareas[i].style.height = addHeight + 15 + 'px';
                }
            })
        })
    }

    addEvent()
</script>
</body>
</html>
